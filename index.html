  <body>
    <div id="root"></div>

    <div id="boot-loader" aria-hidden="true">
      <picture id="boot-backdrop">
        <source media="(orientation: landscape) and (min-aspect-ratio: 2/1)" srcset="/branding/splash-ultrawide.webp?v=20260621-hires1" />
        <source media="(orientation: portrait) and (min-width: 768px)" srcset="/branding/splash-tablet.webp?v=20260621-hires1" />
        <source media="(orientation: portrait) and (max-width: 767px)" srcset="/branding/splash-mobile.webp?v=20260621-hires1" />
        <img src="/branding/splash-desktop.webp?v=20260621-hires1" alt="" id="boot-loader-img" fetchpriority="high" decoding="sync" draggable="false" />
      </picture>

      <div id="boot-status" role="status" aria-live="polite" aria-label="Carregando APE">
        <span id="boot-status-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span id="boot-progress-label">Preparando seu estudo…</span>
      </div>
    </div>

    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        width: 100vw;
        height: 100vh;
        min-width: 100vw;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #09001f;
        opacity: 1;
        transition: opacity 260ms ease-out;
      }
      @supports (height: 100dvh) {
        #boot-loader { height: 100dvh; min-height: 100dvh; }
      }
      #boot-loader.boot-loader--hide { opacity: 0; pointer-events: none; }
      #boot-backdrop {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #boot-loader-img {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
        image-rendering: auto;
        user-select: none;
        -webkit-user-drag: none;
        opacity: 1;
        filter: none;
        transform: none;
        animation: boot-image-in 140ms ease-out both;
      }
      #boot-status {
        position: absolute;
        top: calc(env(safe-area-inset-top, 0px) + 14px);
        left: 50%;
        z-index: 2;
        display: inline-flex;
        max-width: calc(100vw - 28px);
        min-height: 40px;
        align-items: center;
        gap: 10px;
        padding: 9px 14px;
        border: 1px solid rgba(190, 112, 255, 0.42);
        border-radius: 999px;
        background: rgba(15, 5, 42, 0.82);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28), 0 0 22px rgba(164, 73, 255, 0.16);
        color: rgba(255, 255, 255, 0.94);
        font-family: Nunito, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transform: translate(-50%, -8px);
        transition: opacity 180ms ease-out, transform 180ms ease-out;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      #boot-status.boot-status--visible { opacity: 1; transform: translate(-50%, 0); }
      #boot-status-dots { display: inline-flex; align-items: center; gap: 3px; }
      #boot-status-dots i {
        display: block;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #f2c94c;
        box-shadow: 0 0 8px rgba(242, 201, 76, 0.7);
        animation: boot-dot-pulse 900ms ease-in-out infinite;
      }
      #boot-status-dots i:nth-child(2) { animation-delay: 140ms; }
      #boot-status-dots i:nth-child(3) { animation-delay: 280ms; }

      @keyframes boot-image-in {
        from { opacity: 0.92; }
        to { opacity: 1; }
      }
      @keyframes boot-dot-pulse {
        0%, 100% { opacity: 0.38; transform: translateY(0) scale(0.86); }
        50% { opacity: 1; transform: translateY(-2px) scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader, #boot-status, #boot-loader-img { transition: none; animation: none; }
        #boot-status-dots i { animation: none; opacity: 0.85; }
      }
    </style>

    <noscript><p style="text-align:center;padding:40px;color:#ccc;font-family:sans-serif;">JavaScript é necessário para usar o APE.</p></noscript>

    <script>
      window.__apeSplashStart = Date.now();
      window.__APE_SPLASH_MIN_MS = 350;
      window.__APE_SPLASH_MAX_MS = 5000;

      (function() {
        var statusTimer = window.setTimeout(function() {
          var status = document.getElementById('boot-status');
          if (status) status.classList.add('boot-status--visible');
        }, 420);
        window.__apeBootStatusTimer = statusTimer;
        window.__apeBootProgress = function(_value, message) {
          if (!message) return;
          var label = document.getElementById('boot-progress-label');
          if (label) label.textContent = message;
        };
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APE - Apprenticeship Practice and Enhancement</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    
    <!-- Aplicar tema antes do React renderizar -->
    <script>
      (function() {
        try {
          // Aplicar tema salvo ou padrão
          var theme = localStorage.getItem('theme') || 'dark';
          document.documentElement.classList.add(theme);
          
          // Aplicar background sólido imediatamente
          document.documentElement.style.backgroundColor = 
            theme === 'dark' ? 'hsl(224 71% 4%)' : 'hsl(0 0% 100%)';
        } catch (e) {
          // Fallback para tema escuro
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = 'hsl(224 71% 4%)';
        }
      })();
    </script>
    <!-- Google Fonts: Nunito (preconnect + swap) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    
    <meta name="description" content="Aplicativo de flashcards para prática e aprimoramento do aprendizado. Crie coleções e estude com diferentes modos interativos." />
    <meta name="author" content="Lovable" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FFD700" />
    
    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Piteco" />
    <link rel="apple-touch-icon" href="/icons/pwa-192.png" />

    <meta property="og:title" content="APE - Apprenticeship Practice and Enhancement" />
    <meta property="og:description" content="Aplicativo de flashcards para prática e aprimoramento do aprendizado" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lovable_dev" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    
    <!-- Puter.js for better TTS (async to never block boot) -->
    <script src="https://js.puter.com/v2/" async></script>
  </head>

  <body>
    <div id="root">
      <!-- Boot loader — React.createRoot().render() will replace this -->
      <div id="boot-loader" style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;">
        <div style="text-align:center;">
          <div style="width:40px;height:40px;border:3px solid rgba(255,215,0,0.3);border-top-color:#FFD700;border-radius:50%;animation:bl-spin .7s linear infinite;margin:0 auto 16px;"></div>
          <p id="boot-msg" style="color:#aaa;font-size:14px;">Carregando…</p>
        </div>
      </div>
      <style>@keyframes bl-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <noscript><p style="text-align:center;padding:40px;color:#ccc;font-family:sans-serif;">JavaScript é necessário para usar o APE.</p></noscript>

    <!-- Boot timeout: if app didn't mount in 8s, show recovery UI -->
    <script>
      (function(){
        var t = setTimeout(function(){
          var bl = document.getElementById('boot-loader');
          if (!bl) return; // App mounted fine
          var msg = document.getElementById('boot-msg');
          if (msg) {
            msg.innerHTML = 'Falha ao iniciar o app.<br><button id="boot-recover" style="margin-top:12px;padding:10px 20px;border:none;border-radius:8px;background:#FFD700;color:#1a1a2e;font-weight:600;font-size:14px;cursor:pointer;">Limpar cache e recarregar</button>';
            var btn = document.getElementById('boot-recover');
            if (btn) btn.onclick = async function(){
              try {
                var authKeys=[];
                for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.startsWith('sb-'))authKeys.push([k,localStorage.getItem(k)])}
                if('serviceWorker' in navigator){var regs=await navigator.serviceWorker.getRegistrations();await Promise.allSettled(regs.map(function(sw){return sw.unregister()}))}
                if('caches' in window){var names=await caches.keys();await Promise.allSettled(names.map(function(k){return caches.delete(k)}))}
                localStorage.clear(); sessionStorage.clear();
                authKeys.forEach(function(p){localStorage.setItem(p[0],p[1])});
              } catch(e){}
              window.location.href=window.location.origin+'/?t='+Date.now();
            };
          }
        }, 8000);
        window.__apeBootTimer = t;
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

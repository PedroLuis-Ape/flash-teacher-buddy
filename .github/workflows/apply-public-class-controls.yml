name: Apply public class controls

on:
  push:
    branches:
      - feat/public-class-controls

permissions:
  contents: write

jobs:
  implement:
    if: github.event.head_commit.message == 'chore: bootstrap public class controls implementation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/public-class-controls
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          private_path = Path('src/pages/TurmaPrivateDetail.tsx')
          private = private_path.read_text(encoding='utf-8')

          private = replace_once(
              private,
              "ChevronUp, ChevronDown } from 'lucide-react';",
              "ChevronUp, ChevronDown, Globe2, Lock, Copy, ExternalLink } from 'lucide-react';",
              'lucide imports',
          )
          private = replace_once(
              private,
              "import { Textarea } from '@/components/ui/textarea';\n",
              "import { Textarea } from '@/components/ui/textarea';\nimport { Switch } from '@/components/ui/switch';\n",
              'switch import',
          )
          private = replace_once(
              private,
              "  const [editNome, setEditNome] = useState('');\n  const [editDescricao, setEditDescricao] = useState('');\n",
              "  const [editNome, setEditNome] = useState('');\n  const [editDescricao, setEditDescricao] = useState('');\n  const [editPublic, setEditPublic] = useState(false);\n",
              'edit public state',
          )
          private = replace_once(
              private,
              "  const handleOpenEdit = () => {\n    setEditNome(turma?.nome || '');\n    setEditDescricao(turma?.descricao || '');\n    setEditDialogOpen(true);\n  };",
              "  const handleOpenEdit = () => {\n    setEditNome(turma?.nome || '');\n    setEditDescricao(turma?.descricao || '');\n    setEditPublic(turma?.public === true);\n    setEditDialogOpen(true);\n  };",
              'open edit handler',
          )
          private = replace_once(
              private,
              "        nome: editNome,\n        descricao: editDescricao,\n      });\n      toast.success('✅ Turma atualizada!');",
              "        nome: editNome,\n        descricao: editDescricao,\n        public: editPublic,\n      });\n      toast.success(\n        editPublic\n          ? '✅ Turma atualizada e publicada com sucesso!'\n          : '✅ Turma atualizada e definida como privada!',\n      );",
              'update visibility payload',
          )
          private = replace_once(
              private,
              "  const handleDeleteTurma = async () => {",
              "  const handleCopyPublicLink = async () => {\n    if (!turmaId || !isOwner || !turma.public) return;\n\n    const url = `${window.location.origin}/turmas/${turmaId}`;\n    try {\n      await navigator.clipboard.writeText(url);\n      toast.success('Link público copiado!');\n    } catch {\n      toast.error('Não foi possível copiar o link.');\n    }\n  };\n\n  const handleOpenPublicPreview = () => {\n    if (!turmaId || !isOwner || !turma.public) return;\n\n    window.open(\n      `/turmas/${turmaId}?publicPreview=true`,\n      '_blank',\n      'noopener,noreferrer',\n    );\n  };\n\n  const handleDeleteTurma = async () => {",
              'public actions handlers',
          )
          private = replace_once(
              private,
              "            <div className=\"flex-1\">\n              <h1 className=\"text-2xl font-bold\">{turma.nome}</h1>\n              {turma.descricao && (\n                <p className=\"text-sm text-muted-foreground\">{turma.descricao}</p>\n              )}\n            </div>",
              "            <div className=\"flex-1 min-w-0\">\n              <div className=\"flex flex-wrap items-center gap-2\">\n                <h1 className=\"text-2xl font-bold break-words\">{turma.nome}</h1>\n                <Badge variant={turma.public ? 'default' : 'secondary'} className=\"shrink-0\">\n                  {turma.public ? (\n                    <Globe2 className=\"mr-1 h-3 w-3\" />\n                  ) : (\n                    <Lock className=\"mr-1 h-3 w-3\" />\n                  )}\n                  {turma.public ? 'Pública' : 'Privada'}\n                </Badge>\n              </div>\n              {turma.descricao && (\n                <p className=\"text-sm text-muted-foreground break-words\">{turma.descricao}</p>\n              )}\n            </div>",
              'header status badge',
          )
          private = replace_once(
              private,
              "            {isOwner && (\n              <div className=\"flex gap-2\">",
              "            {isOwner && (\n              <div className=\"flex flex-wrap justify-end gap-2\">",
              'responsive header actions',
          )
          private = replace_once(
              private,
              "                <Button variant=\"outline\" size=\"sm\" onClick={handleOpenEdit}>\n                  <Pencil className=\"h-4 w-4 mr-2\" />\n                  Editar\n                </Button>",
              "                {turma.public && (\n                  <>\n                    <Button\n                      variant=\"outline\"\n                      size=\"sm\"\n                      onClick={handleCopyPublicLink}\n                      aria-label=\"Copiar link público da turma\"\n                      title=\"Copiar link público\"\n                    >\n                      <Copy className=\"h-4 w-4 sm:mr-2\" />\n                      <span className=\"hidden sm:inline\">Copiar link</span>\n                    </Button>\n                    <Button\n                      variant=\"outline\"\n                      size=\"sm\"\n                      onClick={handleOpenPublicPreview}\n                      aria-label=\"Ver turma como visitante\"\n                      title=\"Ver como visitante\"\n                    >\n                      <ExternalLink className=\"h-4 w-4 sm:mr-2\" />\n                      <span className=\"hidden sm:inline\">Ver como visitante</span>\n                    </Button>\n                  </>\n                )}\n                <Button variant=\"outline\" size=\"sm\" onClick={handleOpenEdit}>\n                  <Pencil className=\"h-4 w-4 mr-2\" />\n                  Editar\n                </Button>",
              'public header buttons',
          )
          private = replace_once(
              private,
              "      {/* Edit Dialog */}\n      <Dialog open={editDialogOpen} onOpenChange={setEditDialogOpen}>\n        <DialogContent>",
              "      {/* Edit Dialog */}\n      <Dialog open={editDialogOpen} onOpenChange={setEditDialogOpen}>\n        <DialogContent className=\"max-h-[90vh] overflow-y-auto\">",
              'responsive edit dialog',
          )
          private = replace_once(
              private,
              "            <div>\n              <Label htmlFor=\"edit-descricao\">Descrição</Label>\n              <Textarea\n                id=\"edit-descricao\"\n                value={editDescricao}\n                onChange={(e) => setEditDescricao(e.target.value)}\n                placeholder=\"Descrição da turma...\"\n              />\n            </div>\n          </div>",
              "            <div>\n              <Label htmlFor=\"edit-descricao\">Descrição</Label>\n              <Textarea\n                id=\"edit-descricao\"\n                value={editDescricao}\n                onChange={(e) => setEditDescricao(e.target.value)}\n                placeholder=\"Descrição da turma...\"\n              />\n            </div>\n            <div className=\"flex items-center justify-between gap-4 rounded-xl border p-4\">\n              <div className=\"min-w-0 space-y-1\">\n                <Label htmlFor=\"edit-turma-publica\" className=\"flex items-center gap-2\">\n                  {editPublic ? (\n                    <Globe2 className=\"h-4 w-4 text-primary\" />\n                  ) : (\n                    <Lock className=\"h-4 w-4 text-muted-foreground\" />\n                  )}\n                  {editPublic ? 'Turma pública' : 'Turma privada'}\n                </Label>\n                <p className=\"text-xs text-muted-foreground\">\n                  {editPublic\n                    ? 'Qualquer pessoa com o link poderá visualizar as atividades em modo somente leitura.'\n                    : 'Somente o professor e os alunos matriculados podem acessar.'}\n                </p>\n                <p className=\"text-xs text-muted-foreground\">\n                  Visitantes não poderão editar conteúdo nem registrar progresso.\n                </p>\n              </div>\n              <Switch\n                id=\"edit-turma-publica\"\n                checked={editPublic}\n                onCheckedChange={setEditPublic}\n                aria-label=\"Permitir acesso público à turma\"\n                className=\"shrink-0\"\n              />\n            </div>\n          </div>",
              'visibility switch',
          )
          private_path.write_text(private, encoding='utf-8')

          detail_path = Path('src/pages/TurmaDetail.tsx')
          detail = detail_path.read_text(encoding='utf-8')
          detail = replace_once(
              detail,
              "import { useParams } from 'react-router-dom';",
              "import { useParams, useSearchParams } from 'react-router-dom';",
              'detail search params import',
          )
          detail = replace_once(
              detail,
              "  const { turmaId } = useParams<{ turmaId: string }>();\n  const { user, isLoading: authLoading } = useAuthUser();",
              "  const { turmaId } = useParams<{ turmaId: string }>();\n  const [searchParams] = useSearchParams();\n  const { user, isLoading: authLoading } = useAuthUser();\n  const publicPreview = searchParams.get('publicPreview') === 'true';",
              'detail preview state',
          )
          detail = replace_once(
              detail,
              "    queryKey: ['turma-access-gate', turmaId, user?.id],",
              "    queryKey: ['turma-access-gate', turmaId, user?.id, publicPreview],",
              'detail query key',
          )
          detail = replace_once(
              detail,
              "    enabled: !!turmaId && !!user && !authLoading,",
              "    enabled: !!turmaId && !!user && !authLoading && !publicPreview,",
              'detail preview query guard',
          )
          detail = replace_once(
              detail,
              "  if (authLoading || (user && accessQuery.isLoading)) {",
              "  if (publicPreview) {\n    return <TurmaPublicPage />;\n  }\n\n  if (authLoading || (user && accessQuery.isLoading)) {",
              'detail public preview return',
          )
          detail_path.write_text(detail, encoding='utf-8')

          public_path = Path('src/pages/TurmaPublicPage.tsx')
          public_page = public_path.read_text(encoding='utf-8')
          public_page = replace_once(
              public_page,
              "  const guest = !user;\n  const selectedAssignmentId = searchParams.get('atribuicao');",
              "  const guest = !user;\n  const selectedAssignmentId = searchParams.get('atribuicao');\n  const publicPreview = searchParams.get('publicPreview') === 'true';\n\n  const updatePublicSearchParams = (assignmentId?: string) => {\n    const params = new URLSearchParams();\n    if (publicPreview) params.set('publicPreview', 'true');\n    if (assignmentId) params.set('atribuicao', assignmentId);\n    setSearchParams(params);\n  };",
              'public preview params helper',
          )
          public_page = public_page.replace("setSearchParams({})", "updatePublicSearchParams()")
          public_page = replace_once(
              public_page,
              "setSearchParams({ atribuicao: atribuicao.id })",
              "updatePublicSearchParams(atribuicao.id)",
              'public assignment preview navigation',
          )
          public_path.write_text(public_page, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, tests, lint and production build
        run: npm run check

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/TurmaPrivateDetail.tsx src/pages/TurmaDetail.tsx src/pages/TurmaPublicPage.tsx
          git commit -m "feat: add public visibility controls inside class"
          git push origin HEAD:feat/public-class-controls

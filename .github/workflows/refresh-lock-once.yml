name: Refresh Lockfile Once

on:
  push:
    branches:
      - study-core-stabilization

permissions:
  contents: write

concurrency:
  group: refresh-lock-study-core
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: study-core-stabilization
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh package lock
        run: npm install --package-lock-only --legacy-peer-deps --no-audit --no-fund

      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sincroniza package-lock"
          git push origin HEAD:study-core-stabilization

name: Public Classes Diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Run tests and capture full output
        id: tests
        shell: bash
        run: |
          set +e
          npm run test -- --reporter=verbose > test-output.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload test output
        uses: actions/upload-artifact@v4
        with:
          name: public-classes-test-output
          path: test-output.log
          retention-days: 1
      - name: Fail when tests failed
        if: steps.tests.outputs.status != '0'
        run: exit 1

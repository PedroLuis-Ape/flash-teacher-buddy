name: List markers validation

on:
  pull_request:
    paths:
      - "src/pages/Folder.tsx"
      - "src/hooks/useListAttention.ts"
      - "src/features/study/components/ListMarkerButtons.tsx"
      - "src/features/study/lib/listMarkers.ts"
      - "src/features/study/lib/listMarkers.test.ts"
      - "supabase/migrations/*user_list_attention*.sql"
      - ".github/workflows/list-markers-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Focused tests
        run: npx vitest run src/features/study/lib/listMarkers.test.ts
      - name: Production build
        run: npm run build

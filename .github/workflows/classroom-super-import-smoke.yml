name: Classroom Super Import Smoke

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "src/features/global-import/**"
      - "src/features/classroom/**"
      - "src/pages/TurmaDetailWithContent.tsx"
      - "src/App.tsx"
      - ".github/workflows/classroom-super-import-smoke.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/classroom-super-import-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classroom-super-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Rebuild local database
        run: |
          supabase start
          supabase db reset --local --no-seed

      - name: Import and undo a classroom package
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            teacher_id uuid := '11111111-1111-4111-8111-111111111111';
            turma_id uuid := '44444444-4444-4444-8444-444444444444';
            report jsonb;
            batch_id uuid;
          BEGIN
            INSERT INTO auth.users (
              instance_id, id, aud, role, email, encrypted_password,
              email_confirmed_at, raw_app_meta_data, raw_user_meta_data,
              created_at, updated_at
            ) VALUES (
              '00000000-0000-0000-0000-000000000000',
              teacher_id,
              'authenticated',
              'authenticated',
              'classroom-import@app-piteco.local',
              crypt('smoke-password', gen_salt('bf')),
              now(),
              '{"provider":"email","providers":["email"]}'::jsonb,
              '{}'::jsonb,
              now(),
              now()
            ) ON CONFLICT (id) DO NOTHING;

            PERFORM set_config('request.jwt.claim.sub', teacher_id::text, true);
            PERFORM set_config('request.jwt.claim.role', 'authenticated', true);

            INSERT INTO public.profiles(id, first_name, is_teacher)
            VALUES (teacher_id, 'Importer Smoke', true)
            ON CONFLICT (id) DO UPDATE SET is_teacher = true;

            INSERT INTO public.turmas(id, owner_teacher_id, nome, ativo, public)
            VALUES (turma_id, teacher_id, 'Classroom importer smoke', true, true)
            ON CONFLICT (id) DO NOTHING;

            SELECT public.import_app_piteco_super_package_to_class_v1(
              '55555555-5555-4555-8555-555555555555',
              '{
                "schema":"app-piteco-super-import",
                "version":"2.0",
                "package":{
                  "name":"Classroom Smoke Package",
                  "folders":[{
                    "name":"Classroom Smoke Folder",
                    "lists":[{
                      "name":"Classroom Smoke List",
                      "front_language":"en",
                      "back_language":"pt-BR",
                      "study_type":"language",
                      "tts_enabled":true,
                      "glossary":[{
                        "term":"classroom",
                        "translation":"turma",
                        "side":"A",
                        "note":"smoke glossary"
                      }],
                      "cards":[{
                        "type":"normal",
                        "front":"Welcome to class",
                        "back":"Bem-vindo à turma",
                        "detailed_explanation":"Classroom-only smoke card"
                      }]
                    }]
                  }]
                }
              }'::jsonb,
              '{
                "folders":{
                  "0":{
                    "folder":{"mode":"create","name":"Classroom Smoke Folder"},
                    "lists":{"0":{"mode":"create","name":"Classroom Smoke List"}}
                  }
                }
              }'::jsonb,
              turma_id,
              'skip'
            ) INTO report;

            IF COALESCE((report->>'assignments_created')::integer, 0) <> 1
               OR COALESCE((report->>'folders_created')::integer, 0) <> 1
               OR COALESCE((report->>'lists_created')::integer, 0) <> 1
               OR COALESCE((report->>'cards_created')::integer, 0) <> 1
               OR COALESCE((report->>'glossary_created')::integer, 0) <> 1
               OR report->>'target_scope' <> 'classroom'
               OR (report->>'turma_id')::uuid <> turma_id THEN
              RAISE EXCEPTION 'Unexpected classroom importer report: %', report;
            END IF;

            IF NOT EXISTS (
              SELECT 1
              FROM public.atribuicoes a
              JOIN public.folders f ON f.id = a.fonte_id
              JOIN public.lists l ON l.folder_id = f.id
              JOIN public.flashcards c ON c.list_id = l.id
              JOIN public.list_glossary g ON g.list_id = l.id
              WHERE a.turma_id = turma_id
                AND a.fonte_tipo::text = 'pasta'
                AND f.owner_id = teacher_id
                AND f.class_id = turma_id
                AND f.visibility = 'class'
                AND l.owner_id = teacher_id
                AND l.class_id = turma_id
                AND l.visibility = 'class'
                AND c.term = 'Welcome to class'
                AND c.translation = 'Bem-vindo à turma'
                AND g.original_text = 'classroom'
                AND g.translated_text = 'turma'
            ) THEN
              RAISE EXCEPTION 'Classroom importer did not persist the isolated hierarchy.';
            END IF;

            batch_id := (report->>'batch_id')::uuid;
            PERFORM public.undo_classroom_global_import_v1(batch_id);

            IF EXISTS (
              SELECT 1 FROM public.folders
              WHERE owner_id = teacher_id
                AND class_id = turma_id
                AND title = 'Classroom Smoke Folder'
            ) OR EXISTS (
              SELECT 1 FROM public.atribuicoes
              WHERE turma_id = turma_id
                AND titulo = 'Classroom Smoke Folder'
            ) OR NOT EXISTS (
              SELECT 1 FROM public.global_import_batches
              WHERE id = batch_id
                AND status = 'undone'
            ) THEN
              RAISE EXCEPTION 'Classroom import undo left residual data.';
            END IF;
          END;
          $$;
          SQL

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

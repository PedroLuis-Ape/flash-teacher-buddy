name: Classroom Super Import Smoke

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/classroom_super_import_smoke.sql"
      - "src/features/global-import/**"
      - "src/features/classroom/**"
      - "src/pages/TurmaDetailWithContent.tsx"
      - "src/App.tsx"
      - ".github/workflows/classroom-super-import-smoke.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/classroom_super_import_smoke.sql"
      - ".github/workflows/classroom-super-import-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classroom-super-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Rebuild local database
        run: |
          set -o pipefail
          supabase start 2>&1 | tee classroom-db-reset.log
          supabase db reset --local --no-seed 2>&1 | tee -a classroom-db-reset.log

      - name: Import and undo a classroom package
        run: |
          set -o pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/classroom_super_import_smoke.sql 2>&1 | tee classroom-smoke.log

      - name: Upload classroom smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-super-import-diagnostics
          path: |
            classroom-db-reset.log
            classroom-smoke.log
          if-no-files-found: warn
          retention-days: 3

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

name: Supabase Clean Install

on:
  push:
    branches:
      - fix-supabase-v2-alignment
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-clean-install.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-clean-install.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset --local --no-seed

      - name: Lint local database
        run: supabase db lint --local --level warning

      - name: Export final public schema
        if: always()
        run: |
          mkdir -p clean-install-artifacts
          supabase db dump --local --schema public --file clean-install-artifacts/public-schema.sql || true
          cp -R supabase/migrations clean-install-artifacts/migrations

      - name: Upload clean-install artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-clean-install-artifacts
          path: clean-install-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

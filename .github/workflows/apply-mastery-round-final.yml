name: Apply Mastery Round Final Patch

on:
  pull_request:
    branches: [main]
    paths:
      - "patches/mastery-round-final.patch"
      - ".github/workflows/apply-mastery-round-final.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply final patch
        shell: bash
        run: |
          patch --batch --forward -p1 < patches/mastery-round-final.patch
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/study/hooks/useStudyEngine.ts src/pages/Study.tsx
          git commit -m "fix(study): finalizar resumo intermediário de rodadas"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

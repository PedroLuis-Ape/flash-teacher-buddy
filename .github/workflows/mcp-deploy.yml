name: MCP Deploy (Supabase Edge Function)

# Publica a Edge Function `mcp` no projeto de PRODUÇÃO (ymahldldyxvwjeruaxpr).
#
# Contexto que não pode ser esquecido:
# - `supabase/functions/mcp/index.ts` é artefato GERADO. Rode `node scripts/build-mcp-deno-bundle.mjs`
#   depois do build antes de commitar; um `vite build` no Windows reescreve o arquivo com caminho
#   absoluto e invalida o bundle (o passo "Conferir bundle" abaixo barra esse caso).
# - `supabase/config.toml` aponta para outro projeto (xrnfhhoxmmstagmelvyi), que NÃO é o da
#   aplicação. Por isso o `--project-ref` explícito aqui.
# - `--no-verify-jwt` preserva o fluxo OAuth atual: a função responde 401 por conta própria
#   (handler do @lovable.dev/mcp-js) em vez de depender do JWT do gateway.
#
# Pré-requisito: secret `SUPABASE_ACCESS_TOKEN` (token pessoal da conta que possui o projeto).
# Sem o secret o job apenas avisa e não falha o CI.

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/mcp/**"
      - "src/lib/mcp/**"
      - ".github/workflows/mcp-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-deploy-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_REF: ymahldldyxvwjeruaxpr
      FUNCTION_URL: https://ymahldldyxvwjeruaxpr.supabase.co/functions/v1/mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Conferir secret
        id: secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN ausente: deploy da Edge Function mcp ignorado. Adicione o secret em Settings > Secrets and variables > Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Conferir bundle
        if: steps.secret.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          file="supabase/functions/mcp/index.ts"
          test -f "$file" || { echo "::error::$file não existe."; exit 1; }
          if grep -qE 'npm:C:|npm:@/' "$file"; then
            echo "::error::$file contém caminho local externalizado (bundle inválido). Rode: node scripts/build-mcp-deno-bundle.mjs"
            exit 1
          fi
          for tool in get_my_profile get_piteco_capabilities preview_content_import execute_content_import preview_glossary_import execute_glossary_import; do
            grep -q "$tool" "$file" || { echo "::error::$file não contém a tool $tool."; exit 1; }
          done
          echo "Bundle OK: $(wc -l < "$file") linhas, tools essenciais presentes."

      - name: Setup Supabase CLI
        if: steps.secret.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy da função mcp
        if: steps.secret.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions deploy mcp --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Smoke do endpoint (existe e exige OAuth)
        if: steps.secret.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          body='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          code=$(curl -sS -o /tmp/mcp_init.json -w '%{http_code}' -X POST "$FUNCTION_URL" \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            --data "$body" || true)
          echo "HTTP=$code"
          head -c 300 /tmp/mcp_init.json || true
          if [ "$code" = "404" ]; then
            echo "::error::Função mcp não encontrada no endpoint de produção."
            exit 1
          fi
          if [ "$code" != "401" ] && [ "$code" != "200" ]; then
            echo "::error::Resposta inesperada do endpoint mcp (HTTP $code)."
            exit 1
          fi
          {
            echo "### MCP deploy"
            echo ""
            echo "- função **mcp** em \`$PROJECT_REF\`"
            echo "- \`verify_jwt=false\` (OAuth continua sendo tratado pelo handler)"
            echo "- endpoint respondeu HTTP $code"
          } >> "$GITHUB_STEP_SUMMARY"

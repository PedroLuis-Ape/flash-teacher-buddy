name: Check ymah migration access

on:
  push:
    branches:
      - tmp-review-noop
    paths:
      - .github/workflows/check-ymah-review-migration-access.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROJECT_REF: ymahldldyxvwjeruaxpr
    steps:
      - name: Check secret presence
        id: secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_ACCESS_TOKEN is not configured."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read-only production access probe
        if: steps.secret.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/body.json
          import json
          print(json.dumps({
            "query": "select to_regclass('public.user_flashcard_review_flags')::text as review_table",
            "read_only": True,
          }))
          PY
          code=$(curl -sS -o /tmp/result.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/body.json)
          echo "HTTP=$code"
          if [ "$code" != "200" ]; then
            python - <<'PY'
          import json
          try:
              data=json.load(open('/tmp/result.json'))
              print('probe_error=', data.get('message') or data.get('error') or 'unknown')
          except Exception:
              print('probe_error=unparseable')
          PY
            exit 1
          fi
          python - <<'PY'
          import json
          data=json.load(open('/tmp/result.json'))
          exists = bool(data and data[0].get('review_table'))
          print('production_access=ok')
          print('review_table_exists=' + ('true' if exists else 'false'))
          PY

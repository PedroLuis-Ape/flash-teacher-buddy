name: Apply safe back navigation audit

on:
  push:
    branches:
      - fix/navigation-back-audit
    paths:
      - .github/workflows/apply-safe-back-audit.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/navigation-back-audit
          fetch-depth: 1

      - name: Replace fragile back navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("src")
          safe_import = 'import { safeGoBack } from "@/lib/safeNavigation";\n'
          changed = []

          def add_import(source: str) -> str:
              if safe_import.strip() in source:
                  return source
              imports = list(re.finditer(r"(?ms)^import\b.*?;\n", source))
              if not imports:
                  return safe_import + source
              position = imports[-1].end()
              return source[:position] + safe_import + source[position:]

          for path in sorted(root.rglob("*")):
              if path.suffix not in {".ts", ".tsx", ".js", ".jsx"}:
                  continue
              if path.as_posix() == "src/lib/safeNavigation.ts":
                  continue

              source = path.read_text(encoding="utf-8")
              updated = re.sub(r"\bnavigate\s*\(\s*-1\s*\)", "safeGoBack(navigate)", source)
              updated = re.sub(r"\bwindow\.history\.back\s*\(\s*\)", "safeGoBack(navigate)", updated)

              if updated != source:
                  updated = add_import(updated)
                  path.write_text(updated, encoding="utf-8")
                  changed.append(path.as_posix())

          app_path = Path("src/App.tsx")
          app = app_path.read_text(encoding="utf-8")
          tracker_import = 'import { NavigationHistoryTracker } from "@/components/NavigationHistoryTracker";\n'
          if tracker_import.strip() not in app:
              anchor = 'import { SessionWatcher } from "@/components/SessionWatcher";\n'
              if anchor not in app:
                  raise RuntimeError("App.tsx: SessionWatcher import anchor not found")
              app = app.replace(anchor, anchor + tracker_import, 1)

          tracker_mount = "                <NavigationHistoryTracker />\n"
          if tracker_mount.strip() not in app:
              anchor = "              <BrowserRouter>\n"
              if anchor not in app:
                  raise RuntimeError("App.tsx: BrowserRouter mount anchor not found")
              app = app.replace(anchor, anchor + tracker_mount, 1)

          app_path.write_text(app, encoding="utf-8")
          if "src/App.tsx" not in changed:
              changed.append("src/App.tsx")

          violations = []
          for path in sorted(root.rglob("*")):
              if path.suffix not in {".ts", ".tsx", ".js", ".jsx"}:
                  continue
              if path.as_posix() == "src/lib/safeNavigation.ts":
                  continue
              source = path.read_text(encoding="utf-8")
              if re.search(r"\bnavigate\s*\(\s*-1\s*\)", source) or re.search(r"\bwindow\.history\.back\s*\(\s*\)", source):
                  violations.append(path.as_posix())

          if violations:
              raise RuntimeError("Raw back navigation remains in: " + ", ".join(violations))

          print(f"Updated {len(changed)} files")
          for path in changed:
              print(path)
          PY

          git diff --check

      - name: Commit audited navigation
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix(navigation): substituir retornos frágeis pelo histórico interno"
          git push origin HEAD:fix/navigation-back-audit

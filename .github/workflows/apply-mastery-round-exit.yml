name: Apply Mastery Round Exit Patch

on:
  pull_request:
    branches: [main]
    paths:
      - "patches/mastery-round-exit.patch"
      - ".github/workflows/apply-mastery-round-exit.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply safe exit changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pages/Study.tsx")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  'onClick={() => void handleFinishedExit()}\n                disabled={isCompleting || isRestarting}\n              >\n                Voltar à Lista',
                  'onClick={() => void (showNextRound ? handleExit() : handleFinishedExit())}\n                disabled={isCompleting || isRestarting}\n              >\n                {showNextRound ? "Encerrar por agora" : "Voltar à Lista"}',
              ),
              (
                  '<Button variant="ghost" size="sm" onClick={() => void handleFinishedExit()} disabled={isCompleting || isRestarting}>\n                Voltar',
                  '<Button variant="ghost" size="sm" onClick={() => void (showNextRound ? handleExit() : handleFinishedExit())} disabled={isCompleting || isRestarting}>\n                {showNextRound ? "Encerrar por agora" : "Voltar"}',
              ),
          ]
          for old, new in replacements:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f"Trecho esperado não encontrado: {old[:70]}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Study.tsx
          git commit -m "fix(study): sair entre rodadas sem concluir o percurso"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

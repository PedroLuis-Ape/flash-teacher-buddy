name: Finalize study input and commands

on:
  push:
    branches:
      - fix/finalize-study-input-commands
    paths:
      - .github/workflows/finalize-study-input-commands.yml
      - scripts/finalize-study-input-commands.py

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finalize-study-input-commands
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply final study runtime fixes
        run: python scripts/finalize-study-input-commands.py
      - name: Install dependencies
        run: npm install --no-save --no-audit --no-fund
      - name: Focused study tests
        run: npx vitest run src/features/study/lib/studyCommandRegistry.test.ts src/features/study/lib/typeToAnswer.test.ts src/features/study/components/studyRuntimeInput.contract.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint touched study files
        run: npx eslint src/pages/Study.tsx src/features/study/components/WriteStudyView.impl.tsx src/features/study/components/StudyCommandsPanel.tsx src/features/study/hooks/useTypeToAnswer.ts src/features/study/lib/studyCommandRegistry.ts src/features/study/lib/typeToAnswer.ts src/features/study/lib/studyCommandRegistry.test.ts src/features/study/lib/typeToAnswer.test.ts src/features/study/components/studyRuntimeInput.contract.test.ts
      - name: Build
        run: npm run build
      - name: Commit finalized runtime
        shell: bash
        run: |
          git config user.name "study-runtime-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/Study.tsx src/features/study/lib/studyCommandRegistry.test.ts src/features/study/lib/typeToAnswer.test.ts src/features/study/components/studyRuntimeInput.contract.test.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(study): finalize contextual commands and type-to-answer"
          git push origin HEAD:fix/finalize-study-input-commands

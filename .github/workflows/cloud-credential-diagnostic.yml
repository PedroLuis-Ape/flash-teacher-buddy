name: Cloud Credential Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Report configured deployment credentials
        shell: bash
        env:
          HAS_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          HAS_SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID != '' }}
          HAS_SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD != '' }}
          HAS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
          HAS_LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY != '' }}
          HAS_LOVABLE_TOKEN: ${{ secrets.LOVABLE_TOKEN != '' }}
        run: |
          echo "SUPABASE_ACCESS_TOKEN=$HAS_SUPABASE_ACCESS_TOKEN"
          echo "SUPABASE_PROJECT_ID=$HAS_SUPABASE_PROJECT_ID"
          echo "SUPABASE_DB_PASSWORD=$HAS_SUPABASE_DB_PASSWORD"
          echo "SUPABASE_SERVICE_ROLE_KEY=$HAS_SUPABASE_SERVICE_ROLE_KEY"
          echo "LOVABLE_API_KEY=$HAS_LOVABLE_API_KEY"
          echo "LOVABLE_TOKEN=$HAS_LOVABLE_TOKEN"

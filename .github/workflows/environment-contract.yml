name: Environment contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Validate platform configuration
        run: |
          node scripts/check-platform.mjs
          node scripts/check-runtime.mjs
          node scripts/validate-environment.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Runtime bootstrap tests
        run: >-
          npm run test --
          src/lib/bootstrapPreviewFallback.test.ts
          src/integrations/supabase/runtimeBootstrap.test.ts

      - name: Production build
        run: npm run build

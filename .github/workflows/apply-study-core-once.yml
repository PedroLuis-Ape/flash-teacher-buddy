name: Apply Study Core Once

on:
  push:
    branches:
      - study-core-stabilization

permissions:
  contents: write

concurrency:
  group: apply-study-core-stabilization
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: study-core-stabilization
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply verified transformation
        run: node scripts/apply-study-core-stabilization.mjs

      - name: Commit generated integration
        shell: bash
        run: |
          if git diff --quiet -- src/pages/Study.tsx src/features/study/hooks/useStudyEngine.ts; then
            echo "Transformation already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Study.tsx src/features/study/hooks/useStudyEngine.ts
          git commit -m "fix: integra escopo vermelho independente"
          git push origin HEAD:study-core-stabilization

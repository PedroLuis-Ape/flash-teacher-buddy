name: Apply Mastery Round Fix

on:
  pull_request:
    branches: [main]
    paths:
      - "patches/mastery-round-fix/**"
      - ".github/workflows/apply-mastery-round-fix.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Detect already applied fix
        id: detect
        shell: bash
        run: |
          if grep -q 'readonly version: 2' src/features/study/lib/studySessionFlow.ts; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check and apply patches
        if: steps.detect.outputs.applied != 'true'
        id: patch
        shell: bash
        run: |
          rm -f patches/mastery-round-fix/failure.log
          for patch in patches/mastery-round-fix/*.patch; do
            echo "Checking $patch"
            if ! git apply --check --verbose "$patch" 2>patch-error.log; then
              {
                echo "FAILED_PATCH=$patch"
                cat patch-error.log
              } > patches/mastery-round-fix/failure.log
              echo "failed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          for patch in patches/mastery-round-fix/*.patch; do
            git apply "$patch"
          done
          echo "failed=false" >> "$GITHUB_OUTPUT"

      - name: Commit diagnostic
        if: steps.detect.outputs.applied != 'true' && steps.patch.outputs.failed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches/mastery-round-fix/failure.log
          git commit -m "chore: registrar falha de aplicação do patch"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Commit implementation
        if: steps.detect.outputs.applied != 'true' && steps.patch.outputs.failed != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/study src/pages/Study.tsx src/pages/MixedStudy.tsx
          git commit -m "fix(study): restaurar fronteira e resumo das rodadas"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

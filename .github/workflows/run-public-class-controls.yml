name: Run public class controls implementation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'feat/public-class-controls' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/public-class-controls
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply implementation script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-public-class-controls.yml').read_text(encoding='utf-8')
          marker_start = "          python3 - <<'PY'\n"
          marker_end = "\n          PY\n"
          if marker_start not in workflow or marker_end not in workflow:
              raise SystemExit('Could not locate embedded implementation script')
          block = workflow.split(marker_start, 1)[1].split(marker_end, 1)[0]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              else:
                  lines.append(line)
          source = '\n'.join(lines) + '\n'
          exec(compile(source, 'apply-public-class-controls.py', 'exec'))
          PY

      - name: Install dependencies
        run: npm install

      - name: Typecheck, tests, lint and production build
        run: npm run check

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/TurmaPrivateDetail.tsx src/pages/TurmaDetail.tsx src/pages/TurmaPublicPage.tsx
          git commit -m "feat: add public visibility controls inside class"
          git push origin HEAD:feat/public-class-controls

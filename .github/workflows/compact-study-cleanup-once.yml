name: Compact study progress cleanup

on:
  push:
    branches:
      - feature/compact-study-progress
    paths:
      - .github/workflows/compact-study-cleanup-once.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compact-study-progress
          fetch-depth: 0
      - run: python .github/scripts/apply_compact_study_cleanup.py
      - run: |
          rm .github/scripts/apply_compact_study_cleanup.py
          rm .github/workflows/compact-study-cleanup-once.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(study): clean compact progress integration"
          git push origin HEAD:feature/compact-study-progress

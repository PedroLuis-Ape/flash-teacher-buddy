name: Compact study progress integration

on:
  push:
    branches:
      - feature/compact-study-progress
    paths:
      - .github/workflows/compact-study-progress-once.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/compact-study-progress
          fetch-depth: 0

      - name: Apply targeted integration
        run: python .github/scripts/apply_compact_study_progress.py

      - name: Remove one-shot integration files
        run: |
          rm .github/scripts/apply_compact_study_progress.py
          rm .github/workflows/compact-study-progress-once.yml

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(study): add compact overall progress and repair mastery rounds"
          git push origin HEAD:feature/compact-study-progress

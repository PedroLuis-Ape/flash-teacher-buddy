name: Super Importer Smoke Test

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/super-importer-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/super-importer-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Rebuild local database
        run: |
          supabase start
          supabase db reset --local --no-seed

      - name: Execute official importer transaction
        shell: bash
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            smoke_user uuid := '11111111-1111-4111-8111-111111111111';
            report jsonb;
          BEGIN
            INSERT INTO auth.users (
              instance_id, id, aud, role, email, encrypted_password,
              email_confirmed_at, raw_app_meta_data, raw_user_meta_data,
              created_at, updated_at
            ) VALUES (
              '00000000-0000-0000-0000-000000000000',
              smoke_user,
              'authenticated',
              'authenticated',
              'super-importer-smoke@app-piteco.local',
              crypt('smoke-password', gen_salt('bf')),
              now(),
              '{"provider":"email","providers":["email"]}'::jsonb,
              '{}'::jsonb,
              now(),
              now()
            ) ON CONFLICT (id) DO NOTHING;

            PERFORM set_config('request.jwt.claim.sub', smoke_user::text, true);
            PERFORM set_config('request.jwt.claim.role', 'authenticated', true);

            SELECT public.import_app_piteco_super_package_v1(
              '22222222-2222-4222-8222-222222222222',
              '{
                "schema":"app-piteco-super-import",
                "version":"1.0",
                "declared_totals":{"folders":1,"lists":1,"cards":1},
                "package":{
                  "name":"Smoke Package",
                  "folders":[{
                    "name":"Smoke Folder",
                    "declared_totals":{"lists":1,"cards":1},
                    "lists":[{
                      "name":"Smoke List",
                      "front_language":"en",
                      "back_language":"pt-BR",
                      "declared_card_count":1,
                      "cards":[{"front":"Hello","back":"Olá"}]
                    }]
                  }]
                }
              }'::jsonb,
              '{
                "folders":{
                  "0":{
                    "folder":{"mode":"create","name":"Smoke Folder"},
                    "lists":{"0":{"mode":"create","name":"Smoke List"}}
                  }
                }
              }'::jsonb,
              'skip',
              NULL
            ) INTO report;

            IF COALESCE((report->>'folders_created')::integer, 0) <> 1
               OR COALESCE((report->>'lists_created')::integer, 0) <> 1
               OR COALESCE((report->>'cards_created')::integer, 0) <> 1 THEN
              RAISE EXCEPTION 'Unexpected importer report: %', report;
            END IF;

            IF NOT EXISTS (
              SELECT 1
              FROM public.flashcards AS card
              JOIN public.lists AS list ON list.id = card.list_id
              JOIN public.folders AS folder ON folder.id = list.folder_id
              WHERE card.user_id = smoke_user
                AND card.term = 'Hello'
                AND card.translation = 'Olá'
                AND list.title = 'Smoke List'
                AND folder.title = 'Smoke Folder'
            ) THEN
              RAISE EXCEPTION 'The importer did not persist the expected hierarchy.';
            END IF;
          END;
          $$;
          SQL

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

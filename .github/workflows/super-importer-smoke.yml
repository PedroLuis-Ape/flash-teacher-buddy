name: Super Importer Smoke Test

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/super-importer-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/super-importer-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Rebuild local database
        shell: bash
        run: |
          set -o pipefail
          supabase start 2>&1 | tee supabase-reset.log
          supabase db reset --local --no-seed 2>&1 | tee -a supabase-reset.log

      - name: Upload database reset log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-reset-log
          path: supabase-reset.log
          if-no-files-found: warn
          retention-days: 3

      - name: Execute official, layered and CSV importer transactions
        shell: bash
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            smoke_user uuid := '11111111-1111-4111-8111-111111111111';
            report jsonb;
            layered_list_id uuid;
            layered_parent_id uuid;
            layered_children integer;
          BEGIN
            INSERT INTO auth.users (
              instance_id, id, aud, role, email, encrypted_password,
              email_confirmed_at, raw_app_meta_data, raw_user_meta_data,
              created_at, updated_at
            ) VALUES (
              '00000000-0000-0000-0000-000000000000',
              smoke_user,
              'authenticated',
              'authenticated',
              'super-importer-smoke@app-piteco.local',
              crypt('smoke-password', gen_salt('bf')),
              now(),
              '{"provider":"email","providers":["email"]}'::jsonb,
              '{"first_name":"Super Importer Smoke","requested_account_type":"teacher","requested_public_slug":"super_importer_smoke"}'::jsonb,
              now(),
              now()
            ) ON CONFLICT (id) DO NOTHING;

            PERFORM set_config('request.jwt.claim.sub', smoke_user::text, true);
            PERFORM set_config('request.jwt.claim.role', 'authenticated', true);

            IF NOT EXISTS (
              SELECT 1
              FROM public.profiles p
              JOIN public.user_roles ur ON ur.user_id = p.id
              WHERE p.id = smoke_user
                AND p.is_teacher = true
                AND p.user_type::text = 'professor'
                AND ur.role::text = 'owner'
            ) THEN
              RAISE EXCEPTION 'Signup trigger did not create the importer owner contract.';
            END IF;

            SELECT public.import_app_piteco_super_package_v1(
              '22222222-2222-4222-8222-222222222222',
              '{
                "schema":"app-piteco-super-import",
                "version":"1.0",
                "declared_totals":{"folders":1,"lists":1,"cards":1},
                "package":{
                  "name":"Smoke Package",
                  "folders":[{
                    "name":"Smoke Folder",
                    "declared_totals":{"lists":1,"cards":1},
                    "lists":[{
                      "name":"Smoke List",
                      "front_language":"en",
                      "back_language":"pt-BR",
                      "declared_card_count":1,
                      "cards":[{"front":"Hello","back":"Olá"}]
                    }]
                  }]
                }
              }'::jsonb,
              '{
                "folders":{
                  "0":{
                    "folder":{"mode":"create","name":"Smoke Folder"},
                    "lists":{"0":{"mode":"create","name":"Smoke List"}}
                  }
                }
              }'::jsonb,
              'skip',
              NULL
            ) INTO report;

            IF COALESCE((report->>'folders_created')::integer, 0) <> 1
               OR COALESCE((report->>'lists_created')::integer, 0) <> 1
               OR COALESCE((report->>'cards_created')::integer, 0) <> 1 THEN
              RAISE EXCEPTION 'Unexpected official importer report: %', report;
            END IF;

            SELECT public.import_app_piteco_super_package_current(
              '44444444-4444-4444-8444-444444444444',
              '{
                "schema":"app-piteco-super-import",
                "version":"2.0",
                "declared_totals":{"folders":1,"lists":1,"cards":2,"glossary_entries":0,"layered_groups":1},
                "package":{
                  "name":"Layered Smoke Package",
                  "folders":[{
                    "name":"Layered Smoke Folder",
                    "lists":[{
                      "name":"Layered Smoke List",
                      "front_language":"en",
                      "back_language":"pt-BR",
                      "primary_side":"a",
                      "study_type":"language",
                      "tts_enabled":true,
                      "glossary":[],
                      "cards":[{
                        "type":"layered",
                        "key":"look-up",
                        "group_title":"look up",
                        "layers":[
                          {"key":"look-up-search","front":"I looked up the word.","back":"Eu pesquisei a palavra."},
                          {"key":"look-up-improve","front":"Things are looking up.","back":"As coisas estão melhorando."}
                        ]
                      }]
                    }]
                  }]
                }
              }'::jsonb,
              '{
                "folders":{
                  "0":{
                    "folder":{"mode":"create","name":"Layered Smoke Folder"},
                    "lists":{"0":{"mode":"create","name":"Layered Smoke List"}}
                  }
                }
              }'::jsonb,
              'skip',
              NULL
            ) INTO report;

            IF COALESCE((report->>'cards_created')::integer, 0) <> 2
               OR COALESCE((report->>'layered_groups_created')::integer, 0) <> 1 THEN
              RAISE EXCEPTION 'Unexpected layered importer report: %', report;
            END IF;

            SELECT l.id INTO layered_list_id
            FROM public.lists l
            JOIN public.folders f ON f.id = l.folder_id
            WHERE l.owner_id = smoke_user
              AND l.title = 'Layered Smoke List'
              AND f.title = 'Layered Smoke Folder';

            SELECT id INTO layered_parent_id
            FROM public.flashcards
            WHERE list_id = layered_list_id
              AND user_id = smoke_user
              AND parent_card_id IS NULL
              AND is_layer_group = true
              AND smart_key = 'look-up';

            SELECT count(*) INTO layered_children
            FROM public.flashcards
            WHERE parent_card_id = layered_parent_id
              AND layer_index IN (0, 1)
              AND deleted_at IS NULL;

            IF layered_parent_id IS NULL OR layered_children <> 2 THEN
              RAISE EXCEPTION 'Layered group was not persisted correctly.';
            END IF;

            SELECT public.import_global_package_v1(
              '33333333-3333-4333-8333-333333333333',
              '{
                "schema":"appteco-global-import",
                "version":1,
                "package":{
                  "name":"CSV Smoke Package",
                  "folders":[{
                    "name":"CSV Smoke Folder",
                    "expected_cards":1,
                    "lists":[{
                      "name":"CSV Smoke List",
                      "expected_cards":1,
                      "cards":[{"front":"Good morning","back":"Bom dia"}]
                    }]
                  }]
                }
              }'::jsonb,
              '{
                "folders":{
                  "0":{
                    "folder":{"mode":"create","name":"CSV Smoke Folder"},
                    "lists":{"0":{"mode":"create","name":"CSV Smoke List"}}
                  }
                }
              }'::jsonb,
              'skip',
              NULL
            ) INTO report;

            IF COALESCE((report->>'folders_created')::integer, 0) <> 1
               OR COALESCE((report->>'lists_created')::integer, 0) <> 1
               OR COALESCE((report->>'cards_created')::integer, 0) <> 1 THEN
              RAISE EXCEPTION 'Unexpected CSV importer report: %', report;
            END IF;

            IF NOT EXISTS (
              SELECT 1
              FROM public.flashcards AS card
              JOIN public.lists AS list_row ON list_row.id = card.list_id
              JOIN public.folders AS folder ON folder.id = list_row.folder_id
              WHERE card.user_id = smoke_user
                AND card.term = 'Good morning'
                AND card.translation = 'Bom dia'
                AND list_row.title = 'CSV Smoke List'
                AND folder.title = 'CSV Smoke Folder'
            ) THEN
              RAISE EXCEPTION 'The CSV importer did not persist the expected hierarchy.';
            END IF;
          END;
          $$;
          SQL

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

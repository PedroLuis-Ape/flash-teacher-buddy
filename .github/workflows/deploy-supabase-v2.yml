name: Deploy Supabase V2

on:
  workflow_dispatch:
  push:
    branches:
      - fix-supabase-v2-alignment
    paths:
      - ".github/workflows/deploy-supabase-v2.yml"
      - "supabase/migrations/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-supabase-v2.yml"
      - "supabase/migrations/**"

permissions:
  contents: read

concurrency:
  group: deploy-supabase-v2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DIRECT_DB_URL: ${{ secrets.SUPABASE_DB_URL || secrets.DATABASE_URL || secrets.POSTGRES_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD || secrets.POSTGRES_PASSWORD }}
      PROJECT_REF: xrnfhhoxmmstagmelvyi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect available free deployment credentials
        id: credentials
        shell: bash
        run: |
          if [ -n "$DIRECT_DB_URL" ]; then
            echo "mode=direct" >> "$GITHUB_OUTPUT"
          elif [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "mode=cli" >> "$GITHUB_OUTPUT"
          else
            echo "No supported Supabase deployment credentials are configured."
            echo "Expected SUPABASE_DB_URL/DATABASE_URL, or SUPABASE_ACCESS_TOKEN plus SUPABASE_DB_PASSWORD."
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Build validated schema locally
        run: |
          supabase start
          supabase db reset --local --no-seed
          supabase db lint --local --level warning
          mkdir -p deploy-artifacts
          supabase db dump --local --schema public --file deploy-artifacts/public-schema.sql

      - name: Resolve database connection
        id: connection
        shell: bash
        run: |
          if [ "${{ steps.credentials.outputs.mode }}" = "direct" ]; then
            echo "url=$DIRECT_DB_URL" >> "$GITHUB_OUTPUT"
          else
            supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
            DB_URL="postgresql://postgres.${PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-east-2.pooler.supabase.com:5432/postgres"
            echo "url=$DB_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply validated schema to Supabase V2
        shell: bash
        env:
          TARGET_DB_URL: ${{ steps.connection.outputs.url }}
        run: |
          {
            echo 'BEGIN;'
            echo 'DROP SCHEMA IF EXISTS public CASCADE;'
            echo 'CREATE SCHEMA public;'
            echo 'GRANT USAGE ON SCHEMA public TO postgres, anon, authenticated, service_role;'
            echo 'GRANT ALL ON SCHEMA public TO postgres, service_role;'
            cat deploy-artifacts/public-schema.sql
            echo 'COMMIT;'
          } > deploy-artifacts/remote-schema.sql
          psql "$TARGET_DB_URL" -v ON_ERROR_STOP=1 -f deploy-artifacts/remote-schema.sql

      - name: Verify critical application objects
        shell: bash
        env:
          TARGET_DB_URL: ${{ steps.connection.outputs.url }}
        run: |
          psql "$TARGET_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            missing text[] := ARRAY[]::text[];
          BEGIN
            IF to_regclass('public.profiles') IS NULL THEN missing := array_append(missing, 'profiles'); END IF;
            IF to_regclass('public.institutions') IS NULL THEN missing := array_append(missing, 'institutions'); END IF;
            IF to_regclass('public.folders') IS NULL THEN missing := array_append(missing, 'folders'); END IF;
            IF to_regclass('public.lists') IS NULL THEN missing := array_append(missing, 'lists'); END IF;
            IF to_regclass('public.flashcards') IS NULL THEN missing := array_append(missing, 'flashcards'); END IF;
            IF to_regprocedure('public.import_global_package_v1(uuid,jsonb,jsonb,text,uuid)') IS NULL THEN missing := array_append(missing, 'import_global_package_v1'); END IF;
            IF to_regprocedure('public.import_global_package_v2(uuid,jsonb,jsonb,text,uuid)') IS NULL THEN missing := array_append(missing, 'import_global_package_v2'); END IF;
            IF to_regprocedure('public.import_app_piteco_super_package_v1(uuid,jsonb,jsonb,text,uuid)') IS NULL THEN missing := array_append(missing, 'import_app_piteco_super_package_v1'); END IF;
            IF cardinality(missing) > 0 THEN
              RAISE EXCEPTION 'Missing critical objects: %', array_to_string(missing, ', ');
            END IF;
          END $$;

          SELECT count(*) AS public_table_count
          FROM pg_tables
          WHERE schemaname = 'public';
          SQL

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

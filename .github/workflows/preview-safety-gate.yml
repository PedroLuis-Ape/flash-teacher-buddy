name: Preview Safety Gate

on:
  pull_request:
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "scripts/preview-smoke.mjs"
      - ".github/workflows/preview-safety-gate.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "scripts/preview-smoke.mjs"
      - ".github/workflows/preview-safety-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Install Chromium for browser smoke
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and contract tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Preview Safety Gate
        run: npm run preview:smoke

      - name: Upload preview smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-smoke-artifacts
          path: artifacts/preview-smoke/
          if-no-files-found: ignore

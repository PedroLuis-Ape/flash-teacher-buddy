name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  detect-production:
    runs-on: ubuntu-latest
    steps:
      - name: Detect production Supabase project
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl -fsSL https://www.apeeducation.org)"
          printf '%s' "$html" | grep -oE '<script[^>]+src="[^"]+"' | sed -E 's/.*src="([^"]+)"/\1/' > /tmp/assets.txt || true
          : > /tmp/bundle.txt
          while IFS= read -r asset; do
            case "$asset" in
              http*) url="$asset" ;;
              /*) url="https://www.apeeducation.org$asset" ;;
              *) url="https://www.apeeducation.org/$asset" ;;
            esac
            curl -fsSL "$url" >> /tmp/bundle.txt
          done < /tmp/assets.txt
          refs="$(cat /tmp/bundle.txt | grep -oE 'https://[a-z0-9]{20}\.supabase\.co' | sort -u || true)"
          echo "PRODUCTION_SUPABASE_URLS_BEGIN"
          printf '%s\n' "$refs"
          echo "PRODUCTION_SUPABASE_URLS_END"

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Publication validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Generate Phase 0 inventory
        run: node scripts/audit-phase-zero.mjs --out phase-zero-audit.json

      - name: Validate canonization and test account matrices
        run: node scripts/validate-canonization-matrix.mjs

      - name: Validate Phase 0 evidence templates
        run: node scripts/validate-phase-zero-evidence.mjs

      - name: Upload Phase 0 inventory
        uses: actions/upload-artifact@v4
        with:
          name: phase-zero-audit
          path: phase-zero-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Static function policy audit
        run: npm run check:security

      - name: Upload security audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: security-audit-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Dependency vulnerability audit
        run: npm run check:dependencies

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: dependency-audit-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee test-report.log

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.log
          if-no-files-found: warn
          retention-days: 7

      - name: Lint
        run: npm run lint -- --format json --output-file lint-report.json

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.json
          if-no-files-found: warn
          retention-days: 3

      - name: Production build
        if: always()
        run: npm run build

  apply-issue-184-order-patch:
    name: Validate and publish normal-mode order correction
    if: github.event_name == 'pull_request' && github.head_ref == 'issue-184'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: issue-184
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply six guarded replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/study/hooks/useStudyEngine.ts')
          text = path.read_text()
          replacements = [
            (
              '''        // For quiz modes without auth: shuffle all cards (straight-through)\n        const shuffledIds = flashcards\n          .map(f => f.id)\n          .sort(() => Math.random() - 0.5);\n\n        setCardsOrder(shuffledIds);''',
              '''        // Standard modes respect the order chosen in the hub. Mixed mode\n        // owns its adaptive order and therefore remains randomized.\n        const baseIds = flashcards.map(f => f.id);\n        const orderedIds = mode === "mixed" || gameSettings.mode === "random"\n          ? [...baseIds].sort(() => Math.random() - 0.5)\n          : baseIds;\n\n        setCardsOrder(orderedIds);''',
            ),
            (
              '''        // No listId (e.g. collection or portal route) — still mount cards\n        const cardIds = flashcards.map(f => f.id).sort(() => Math.random() - 0.5);\n        setCardsOrder(cardIds);''',
              '''        // No listId (e.g. collection or portal route) — standard modes\n        // respect the order already prepared by Study.tsx.\n        const baseIds = flashcards.map(f => f.id);\n        const cardIds = mode === "mixed" || gameSettings.mode === "random"\n          ? [...baseIds].sort(() => Math.random() - 0.5)\n          : baseIds;\n        setCardsOrder(cardIds);''',
            ),
            (
              '''      let orderedCards = localSnapshot?.cardsOrder\n        ?? await getPrioritizedFlashcards(user.id, listId, flashcards, true);''',
              '''      let orderedCards = localSnapshot?.cardsOrder\n        ?? (mode === "mixed"\n          ? await getPrioritizedFlashcards(user.id, listId, flashcards, true)\n          : gameSettings.mode === "sequential"\n            ? flashcards.map(card => card.id)\n            : flashcards.map(card => card.id).sort(() => Math.random() - 0.5));''',
            ),
            (
              '''      const shuffledIds = flashcards\n        .map(f => f.id)\n        .sort(() => Math.random() - 0.5);\n      \n      setCardsOrder(shuffledIds);''',
              '''      const baseIds = flashcards.map(f => f.id);\n      const fallbackIds = mode === "mixed" || gameSettings.mode === "random"\n        ? [...baseIds].sort(() => Math.random() - 0.5)\n        : baseIds;\n      \n      setCardsOrder(fallbackIds);''',
            ),
            (
              '''      FEATURE_FLAGS.intelligent_study_engine &&\n      !isFlipMode &&\n      !skipped &&\n      !correct''',
              '''      FEATURE_FLAGS.intelligent_study_engine &&\n      mode === "mixed" &&\n      !skipped &&\n      !correct''',
            ),
            (
              '''  }, [listId, cardsSignature, mode, useAllCards, isFlipMode, loadFlipProgress, gameSettings.subset, effectiveRedPlayableIds, sessionScopeKey, studySnapshotKey, userScope]);''',
              '''  }, [listId, cardsSignature, mode, useAllCards, isFlipMode, loadFlipProgress, gameSettings.mode, gameSettings.subset, effectiveRedPlayableIds, sessionScopeKey, studySnapshotKey, userScope]);''',
            ),
          ]

          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'Guard failed: expected one match, found {count}: {old[:90]!r}')
            text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Validate corrected code
        run: |
          npm run typecheck
          npm run test
          npm run lint
          npm run build

      - name: Restore CI definition and publish validated patch
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/study/hooks/useStudyEngine.ts .github/workflows/ci.yml
          git commit -m "fix: respeitar ordem escolhida nos modos normais"
          git push origin HEAD:issue-184

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Publication validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Generate Phase 0 inventory
        run: node scripts/audit-phase-zero.mjs --out phase-zero-audit.json

      - name: Validate canonization and test account matrices
        run: node scripts/validate-canonization-matrix.mjs

      - name: Validate Phase 0 evidence templates
        run: node scripts/validate-phase-zero-evidence.mjs

      - name: Upload Phase 0 inventory
        uses: actions/upload-artifact@v4
        with:
          name: phase-zero-audit
          path: phase-zero-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Static function policy audit
        run: npm run check:security

      - name: Upload security audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: security-audit-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Dependency vulnerability audit
        run: npm run check:dependencies

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: dependency-audit-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee test-report.log

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.log
          if-no-files-found: warn
          retention-days: 7

      - name: Lint
        run: npm run lint -- --format json --output-file lint-report.json

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.json
          if-no-files-found: warn
          retention-days: 3

      - name: Production build
        if: always()
        run: npm run build

  apply-mobile-game-layout:
    name: Validate and publish mobile game layout
    if: github.event_name == 'pull_request' && github.head_ref == 'issue-186-mobile-game-layout'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: issue-186-mobile-game-layout
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded layout corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str):
            text = path.read_text()
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'Guard failed in {path}: expected one match, found {count}: {old[:110]!r}')
            path.write_text(text.replace(old, new))

          mixed = Path('src/pages/MixedStudy.tsx')
          replace_once(
            mixed,
            'import { ArrowLeft, Heart, RefreshCcw, Sparkles, Trophy } from "lucide-react";',
            'import { ArrowLeft, Heart, RefreshCcw, Settings2, Sparkles, Trophy } from "lucide-react";',
          )
          replace_once(
            mixed,
            'import { Progress } from "@/components/ui/progress";\nimport { toast } from "sonner";',
            '''import { Progress } from "@/components/ui/progress";\nimport {\n  DropdownMenu,\n  DropdownMenuContent,\n  DropdownMenuItem,\n  DropdownMenuLabel,\n  DropdownMenuSeparator,\n  DropdownMenuTrigger,\n} from "@/components/ui/dropdown-menu";\nimport { toast } from "sonner";''',
          )
          replace_once(
            mixed,
            '''          <Button size="lg" className="w-full" onClick={mixed.nextRound}>Começar próxima rodada</Button>\n          <Button variant="ghost" onClick={exit}>Sair e continuar depois</Button>''',
            '''          <Button size="lg" className="w-full" onClick={mixed.nextRound}>Começar próxima rodada</Button>\n          <div className="grid grid-cols-2 gap-2">\n            <Button variant="outline" onClick={restartRoundManually}>\n              <RefreshCcw className="mr-2 h-4 w-4" /> Refazer rodada\n            </Button>\n            <Button variant="ghost" onClick={restartJourneyManually}>Reiniciar percurso</Button>\n          </div>\n          <Button variant="ghost" onClick={exit}>Sair e continuar depois</Button>''',
          )
          replace_once(
            mixed,
            '<div className="min-h-screen bg-background px-3 py-4 sm:px-6 sm:py-8">\n      <div className="mx-auto max-w-5xl space-y-4">',
            '<div className="min-h-screen bg-background px-2 py-2 sm:px-6 sm:py-6">\n      <div className="mx-auto max-w-5xl space-y-2 sm:space-y-4">',
          )
          replace_once(
            mixed,
            '''        <div className="flex items-center justify-between gap-3">\n          <Button variant="ghost" size="sm" onClick={exit}><ArrowLeft className="mr-1 h-4 w-4" />Sair</Button>\n          <div className="rounded-full border border-primary/30 bg-primary/10 px-3 py-1 text-xs font-semibold text-primary">\n            ⭐ Modo recomendado\n          </div>\n        </div>''',
            '''        <div className="flex items-center justify-between gap-2">\n          <Button variant="ghost" size="sm" className="h-8 px-2" onClick={exit}>\n            <ArrowLeft className="mr-1 h-4 w-4" />Sair\n          </Button>\n          <div className="flex items-center gap-2">\n            <div className="rounded-full border border-primary/30 bg-primary/10 px-2 py-1 text-[10px] font-semibold text-primary sm:px-3 sm:text-xs">\n              ⭐ Recomendado\n            </div>\n            <DropdownMenu>\n              <DropdownMenuTrigger asChild>\n                <Button variant="outline" size="icon" className="h-8 w-8" aria-label="Configurações da sessão">\n                  <Settings2 className="h-4 w-4" />\n                </Button>\n              </DropdownMenuTrigger>\n              <DropdownMenuContent align="end" className="w-56">\n                <DropdownMenuLabel>Configurações da sessão</DropdownMenuLabel>\n                <DropdownMenuSeparator />\n                <DropdownMenuItem onSelect={restartRoundManually}>\n                  <RefreshCcw className="mr-2 h-4 w-4" /> Reiniciar rodada\n                </DropdownMenuItem>\n                <DropdownMenuItem onSelect={restartJourneyManually}>\n                  Reiniciar percurso\n                </DropdownMenuItem>\n              </DropdownMenuContent>\n            </DropdownMenu>\n          </div>\n        </div>''',
          )
          replace_once(
            mixed,
            '<Card className="space-y-3 p-3 sm:p-4">',
            '<Card className="space-y-2 p-2.5 sm:space-y-3 sm:p-4">',
          )
          replace_once(
            mixed,
            'className={index < state.hearts ? "h-7 w-7 fill-red-500 text-red-500" : "h-7 w-7 text-muted-foreground/30"}',
            'className={index < state.hearts ? "h-6 w-6 fill-red-500 text-red-500 sm:h-7 sm:w-7" : "h-6 w-6 text-muted-foreground/30 sm:h-7 sm:w-7"}',
          )
          replace_once(
            mixed,
            '''          <div className="flex flex-wrap justify-end gap-2 border-t pt-2">\n            <Button variant="ghost" size="sm" onClick={restartRoundManually}>\n              <RefreshCcw className="mr-1 h-4 w-4" /> Reiniciar rodada\n            </Button>\n            <Button variant="ghost" size="sm" onClick={restartJourneyManually}>\n              Reiniciar percurso\n            </Button>\n          </div>''',
            '',
          )

          core = Path('src/features/study/lib/adaptiveMixedSession.ts')
          replace_once(
            core,
            '''export function restartAdaptiveMixedRound(\n  state: AdaptiveMixedSessionState,\n  random: () => number = Math.random,\n): AdaptiveMixedSessionState {\n  if (state.status !== "round-failed" && state.status !== "active") return state;\n  const currentRoundCardIds = shuffleMixedCards(state.currentRoundCardIds, random);\n  const activities = assignActivities(currentRoundCardIds, state.lastActivityByCardId, random);\n  return {\n    ...state,\n    currentRoundCardIds,\n    currentRoundErrors: [],\n    currentRoundAnswered: [],\n    activityByCardId: activities.activityByCardId,\n    lastActivityByCardId: activities.lastActivityByCardId,\n    currentIndex: 0,\n    attemptNumber: state.attemptNumber + 1,\n    hearts: state.maxHearts,\n    status: "active",\n    updatedAt: Date.now(),\n  };\n}''',
            '''export function restartAdaptiveMixedRound(\n  state: AdaptiveMixedSessionState,\n  random: () => number = Math.random,\n): AdaptiveMixedSessionState {\n  if (state.status !== "round-failed" && state.status !== "round-complete" && state.status !== "active") return state;\n\n  const pending = new Set(state.pendingCardIds);\n  const mastered = new Set(state.masteredCardIds);\n  if (state.status === "round-complete") {\n    state.currentRoundCardIds.forEach((cardId) => {\n      mastered.delete(cardId);\n      if (state.currentRoundOrigins[cardId] === "pending") pending.add(cardId);\n      else pending.delete(cardId);\n    });\n  }\n\n  const currentRoundCardIds = shuffleMixedCards(state.currentRoundCardIds, random);\n  const activities = assignActivities(currentRoundCardIds, state.lastActivityByCardId, random);\n  return {\n    ...state,\n    pendingCardIds: unique([...pending]),\n    masteredCardIds: unique([...mastered]),\n    currentRoundCardIds,\n    currentRoundErrors: [],\n    currentRoundAnswered: [],\n    activityByCardId: activities.activityByCardId,\n    lastActivityByCardId: activities.lastActivityByCardId,\n    currentIndex: 0,\n    attemptNumber: state.attemptNumber + 1,\n    hearts: state.maxHearts,\n    status: "active",\n    updatedAt: Date.now(),\n  };\n}''',
          )

          tests = Path('src/features/study/lib/adaptiveMixedSession.test.ts')
          replace_once(
            tests,
            '''  it("calcula o progresso geral por cards dominados, não pelo tamanho da fila", () => {''',
            '''  it("permite refazer uma rodada concluída sem duplicar progresso", () => {\n    let state = createAdaptiveMixedSession(ids(20), { random: fixedRandom });\n    const completedRound = [...state.currentRoundCardIds].sort();\n\n    state.currentRoundCardIds.forEach(() => {\n      state = answerCurrent(state, true);\n    });\n\n    expect(state.status).toBe("round-complete");\n    expect(state.masteredCardIds).toHaveLength(10);\n\n    state = restartAdaptiveMixedRound(state, fixedRandom);\n    expect(state.status).toBe("active");\n    expect(state.masteredCardIds).toHaveLength(0);\n    expect(state.pendingCardIds).toHaveLength(0);\n    expect([...state.currentRoundCardIds].sort()).toEqual(completedRound);\n  });\n\n  it("calcula o progresso geral por cards dominados, não pelo tamanho da fila", () => {''',
          )
          PY

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Validate corrected code
        run: |
          npm run typecheck
          npm run test
          npm run lint
          npm run build

      - name: Restore CI, remove WIP marker and publish validated layout
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f docs/WIP_MOBILE_GAME_LAYOUT_186.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/MixedStudy.tsx src/features/study/lib/adaptiveMixedSession.ts src/features/study/lib/adaptiveMixedSession.test.ts src/components/layout/PrivateShell.tsx .github/workflows/ci.yml docs/WIP_MOBILE_GAME_LAYOUT_186.md
          git commit -m "fix: compactar layout mobile dos jogos"
          git push origin HEAD:issue-186-mobile-game-layout

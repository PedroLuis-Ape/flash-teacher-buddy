name: Prepare canonical store assets

on:
  push:
    branches:
      - feat-piteco-package-manager-v2
    paths:
      - .github/workflows/prepare-store-assets.yml

permissions:
  contents: write

concurrency:
  group: prepare-store-assets-v2
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout package-manager branch
        uses: actions/checkout@v4
        with:
          ref: feat-piteco-package-manager-v2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install temporary image converter
        run: npm install --no-save --package-lock=false sharp@0.33.5

      - name: Convert and organize official package artwork
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs/promises');
          const path = require('node:path');
          const sharp = require('sharp');

          const root = path.resolve('store-packages');
          const assets = [
            ['piteco_prime', 'card', 'Piteco Prime card.png'],
            ['piteco_prime', 'avatar', 'Piteco prime perfil.png'],
            ['piteco_vampiro', 'card', 'vampiro card.png'],
            ['piteco_vampiro', 'avatar', 'vampiro perfil.png'],
            ['piteco_zombie', 'card', 'zombie card.png'],
            ['piteco_zombie', 'avatar', 'zombie perfil.png'],
            ['piteco_ninja', 'card', 'ninja card.png'],
            ['piteco_ninja', 'avatar', 'ninja perfil.png'],
            ['piteco_astronauta', 'card', 'astronalta card.png'],
            ['piteco_astronauta', 'avatar', 'astronauta perfil.png'],
            ['piteco_explorador', 'card', 'explorador card.png'],
            ['piteco_explorador', 'avatar', 'explorador perfil.png'],
          ];

          for (const [packageId, kind, sourceName] of assets) {
            const source = path.join(root, sourceName);
            const packageDir = path.join(root, packageId);
            const target = path.join(packageDir, `${kind}.avif`);
            await fs.access(source);
            await fs.mkdir(packageDir, { recursive: true });

            const image = sharp(source).rotate().resize({
              width: kind === 'avatar' ? 640 : 768,
              height: kind === 'avatar' ? 640 : 1200,
              fit: 'inside',
              withoutEnlargement: true,
            });

            await image.avif({ quality: 62, effort: 6 }).toFile(target);
            const bytes = await fs.readFile(target);
            if (bytes.subarray(4, 12).toString('ascii') !== 'ftypavif') {
              throw new Error(`${target} não foi convertido para AVIF válido.`);
            }
          }
          NODE

      - name: Remove uploaded sources and temporary transfer files
        shell: bash
        run: |
          rm -f \
            "store-packages/Piteco Prime card.png" \
            "store-packages/Piteco prime perfil.png" \
            "store-packages/vampiro card.png" \
            "store-packages/vampiro perfil.png" \
            "store-packages/zombie card.png" \
            "store-packages/zombie perfil.png" \
            "store-packages/ninja card.png" \
            "store-packages/ninja perfil.png" \
            "store-packages/astronalta card.png" \
            "store-packages/astronauta perfil.png" \
            "store-packages/explorador card.png" \
            "store-packages/explorador perfil.png" \
            store-packages/.asset-upload-check \
            store-packages/.payload-* \
            store-packages/**/*.b64
          rm -f .github/workflows/prepare-store-assets.yml

      - name: Validate canonical assets
        run: node scripts/store-packages/validate.mjs

      - name: Commit prepared assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(store): add canonical AVIF package artwork"
          git push origin HEAD:feat-piteco-package-manager-v2

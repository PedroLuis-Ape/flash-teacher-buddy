name: Apply layered card preview

on:
  push:
    branches:
      - feat/layered-card-preview
    paths:
      - scripts/apply-layered-card-preview.py
      - .github/workflows/apply-layered-card-preview.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-layered-card-preview.py
      - .github/workflows/apply-layered-card-preview.yml
      - src/features/cards/components/LayeredCardPreviewDialog.tsx

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Clone feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --depth=1 --branch feat/layered-card-preview "https://x-access-token:${GH_TOKEN}@github.com/PedroLuis-Ape/flash-teacher-buddy.git" repo

      - name: Apply focused source transformation
        working-directory: repo
        run: |
          sed -i 's/"                 onDelete={handleDeleteFlashcard}/"                onDelete={handleDeleteFlashcard}/' scripts/apply-layered-card-preview.py
          sed -i 's/"                 onUnmerge={handleUnmergeLayers}/"                onUnmerge={handleUnmergeLayers}/' scripts/apply-layered-card-preview.py
          python scripts/apply-layered-card-preview.py

      - name: Commit transformed source
        working-directory: repo
        run: |
          if git diff --quiet src/pages/ListDetail.tsx; then
            echo "No source change was required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ListDetail.tsx
          git commit -m "feat(cards): abrir camadas ao clicar no card"
          git push origin HEAD:feat/layered-card-preview

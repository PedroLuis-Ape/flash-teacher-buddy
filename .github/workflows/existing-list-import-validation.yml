name: Existing List Import Validation

on:
  pull_request:
    paths:
      - "src/components/BulkImportDialog.tsx"
      - "src/features/global-import/**"
      - "src/features/smart-import/**"
      - ".github/workflows/existing-list-import-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/components/BulkImportDialog.tsx"
      - "src/features/global-import/**"
      - "src/features/smart-import/**"
      - ".github/workflows/existing-list-import-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Focused tests
        run: >-
          npm run test --
          src/features/smart-import/simplePrompt.test.ts
          src/features/smart-import/importFile.test.ts
          src/features/smart-import/jsonNormalizer.integration.test.ts
          src/features/global-import/smartJsonRepair.test.ts
          src/features/global-import/__tests__/existingListImportPlan.test.ts
          src/features/global-import/destination.test.ts
      - name: Production build
        run: npm run build

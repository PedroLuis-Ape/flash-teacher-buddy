name: Finalize review cards

on:
  push:
    branches:
      - fix/finalize-review-cards
    paths:
      - .github/workflows/finalize-review-cards.yml
      - scripts/finalize-review-cards.py

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finalize-review-cards
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply final wiring
        run: python scripts/finalize-review-cards.py

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Review cards focused contracts
        run: npx vitest run src/features/study/StudyReviewFlagButton.contract.test.tsx src/features/study/reviewCardsFeature.contract.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint touched files
        run: npx eslint src/pages/ReviewCards.tsx src/pages/MixedStudy.tsx src/App.tsx src/components/layout/AppSidebar.tsx src/hooks/useFlashcardReviewFlags.ts src/lib/routePrefetch.ts src/lib/coreWebVitalsRum.ts src/features/study/reviewCardsFeature.contract.test.ts

      - name: Production build
        run: npm run build

      - name: Commit finalized feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "review-cards-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/MixedStudy.tsx src/App.tsx src/components/layout/AppSidebar.tsx src/lib/routePrefetch.ts src/lib/coreWebVitalsRum.ts public/robots.txt scripts/seo-visibility-eval.mjs src/features/study/reviewCardsFeature.contract.test.ts
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "feat(review): finish mixed wiring and review inbox navigation"
          git push origin HEAD:fix/finalize-review-cards

name: Study Preferences Diagnostic

on:
  pull_request:
    paths:
      - "src/features/study/preferences/**"
      - "src/hooks/useStudyPreferences*"
      - "src/pages/GamesHub.tsx"
      - "src/features/study/components/GameSettingsModal*"
      - "supabase/migrations/20260712170000_user_study_preferences.sql"
      - ".github/workflows/study-preferences-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Capture focused test output
        shell: bash
        run: |
          set +e
          npm test -- \
            src/features/study/preferences/studyPreset.test.ts \
            src/features/study/preferences/studyPreferenceCache.test.ts \
            src/features/study/preferences/studyPreferenceRepository.test.ts \
            src/features/study/preferences/studyPreferencesMigration.test.ts \
            src/hooks/useStudyPreferences.test.ts \
            src/hooks/useStudyPreferences.sessionOverrides.test.ts \
            --run > study-preferences-test.log 2>&1
          status=$?
          echo "$status" > study-preferences-test.status
          cat study-preferences-test.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: study-preferences-test-diagnostic
          path: |
            study-preferences-test.log
            study-preferences-test.status
          if-no-files-found: error

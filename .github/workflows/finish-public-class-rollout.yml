name: Finish public class rollout

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    if: github.head_ref == 'fix/public-class-final-hardening' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/public-class-final-hardening
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply remaining hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          public_path = Path('src/pages/TurmaPublicPage.tsx')
          public_page = public_path.read_text(encoding='utf-8')
          public_page = replace_once(
              public_page,
              "import { useAuthUser } from '@/hooks/useAuthUser';\n",
              "import { buildPublicTurmaSearchParams } from '@/features/classroom/lib/turmaAccess';\nimport { useAuthUser } from '@/hooks/useAuthUser';\n",
              'public helper import',
          )
          public_page = replace_once(
              public_page,
              "  const updatePublicSearchParams = (assignmentId?: string) => {\n    const params = new URLSearchParams();\n    if (publicPreview) params.set('publicPreview', 'true');\n    if (assignmentId) params.set('atribuicao', assignmentId);\n    setSearchParams(params);\n  };",
              "  const updatePublicSearchParams = (assignmentId?: string) => {\n    setSearchParams(buildPublicTurmaSearchParams({ publicPreview, assignmentId }));\n  };",
              'public params helper',
          )
          public_path.write_text(public_page, encoding='utf-8')

          private_path = Path('src/pages/TurmaPrivateDetail.tsx')
          private = private_path.read_text(encoding='utf-8')
          private = replace_once(
              private,
              '<div className="flex items-center gap-4 mb-4">',
              '<div className="flex flex-wrap items-center gap-3 mb-4">',
              'header mobile wrap',
          )
          private = replace_once(
              private,
              '<div className="flex flex-wrap justify-end gap-2">',
              '<div className="flex w-full flex-wrap gap-2 sm:w-auto sm:justify-end">',
              'header action row',
          )
          private = replace_once(
              private,
              '<DialogContent className="max-h-[90vh] overflow-y-auto">',
              '<DialogContent className="w-[calc(100vw-2rem)] max-w-lg max-h-[90vh] overflow-y-auto">',
              'edit dialog viewport width',
          )
          private = replace_once(
              private,
              '<div className="flex items-center justify-between gap-4 rounded-xl border p-4">',
              '<div className="flex flex-col gap-4 rounded-xl border p-4 sm:flex-row sm:items-center sm:justify-between">',
              'visibility panel mobile stack',
          )
          private = replace_once(
              private,
              '                className="shrink-0"\n              />',
              '                className="self-end shrink-0 sm:self-auto"\n              />',
              'visibility switch alignment',
          )
          private_path.write_text(private, encoding='utf-8')

          hooks_path = Path('src/features/classroom/hooks/useTurmas.ts')
          hooks = hooks_path.read_text(encoding='utf-8')
          hooks = replace_once(
              hooks,
              "    onSuccess: () => {\n      queryClient.invalidateQueries({ queryKey: ['turmas'] });\n      queryClient.invalidateQueries({ queryKey: ['turma'] });\n      queryClient.invalidateQueries({ queryKey: ['public-turma'] });\n    },",
              "    onSuccess: async () => {\n      await Promise.all([\n        queryClient.invalidateQueries({ queryKey: ['turmas'] }),\n        queryClient.invalidateQueries({ queryKey: ['turma'] }),\n        queryClient.invalidateQueries({ queryKey: ['public-turma'] }),\n      ]);\n    },",
              'await classroom cache refresh',
          )
          hooks_path.write_text(hooks, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install

      - name: Run typecheck, tests, lint and build
        run: npm run check

      - name: Commit final hardening and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finish-public-class-rollout.yml
          git add src/pages/TurmaPublicPage.tsx src/pages/TurmaPrivateDetail.tsx src/features/classroom/hooks/useTurmas.ts
          git commit -m "fix: finish public classroom rollout hardening"
          git push origin HEAD:fix/public-class-final-hardening
